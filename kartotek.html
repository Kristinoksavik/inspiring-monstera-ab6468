<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Malerikartotek — Kristins univers</title>
<style>
  :root{--gull:#c4944a;--gull-mork:#a67a34;--ink:#1a1a1a;--beige:#f5f5f3;--beige-mork:#e8e6e0;--hvit:#fff;--skygge:rgba(26,26,26,.12)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Georgia',serif;color:var(--ink);background:var(--beige);line-height:1.5}
  .wrap{max-width:1100px;margin:0 auto;padding:0 20px}
  h1,h2,h3{font-weight:normal;letter-spacing:.3px}
  a{color:inherit}

  .cba-topp{background:#fff;border-bottom:1px solid var(--beige-mork);display:flex;align-items:center;justify-content:center;gap:14px;padding:12px 20px}
  .cba-topp img{height:40px;width:auto;border-radius:5px;display:block}
  .cba-topp .navn b{display:block;font-family:Georgia,serif;font-style:italic;font-weight:normal;font-size:22px;color:var(--gull)}
  .cba-topp .navn small{display:block;font-size:11px;color:#8a857b}

  header.topp{background:var(--ink);color:var(--beige);text-align:center;padding:40px 0 34px}
  header.topp .kick{color:var(--gull);letter-spacing:3px;text-transform:uppercase;font-size:12px;margin-bottom:12px}
  header.topp h1{font-size:clamp(28px,5vw,40px);margin-bottom:10px}
  header.topp p{opacity:.82;max-width:560px;margin:0 auto;font-size:16px}

  .verktoylinje{position:sticky;top:0;z-index:20;background:var(--beige);border-bottom:1px solid var(--beige-mork);padding:16px 0}
  .verktoylinje .rad{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  #sok{flex:1;min-width:220px;padding:12px 16px;font-family:inherit;font-size:16px;border:1px solid var(--beige-mork);border-radius:6px;background:#fff}
  .teller{font-size:14px;opacity:.7;white-space:nowrap}
  .filterknapp{font-family:inherit;font-size:13px;padding:9px 14px;border:1px solid var(--beige-mork);background:#fff;border-radius:20px;cursor:pointer;transition:.15s}
  .filterknapp.aktiv{background:var(--ink);color:#fff;border-color:var(--ink)}

  .rutenett{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px;padding:28px 0 60px}
  .kort{background:#fff;border:1px solid var(--beige-mork);border-radius:12px;overflow:hidden;box-shadow:0 5px 16px var(--skygge);display:flex;flex-direction:column;transition:.15s}
  .kort:hover{transform:translateY(-3px);box-shadow:0 10px 26px var(--skygge)}
  .kort .bilde{aspect-ratio:4/3;background:var(--beige-mork);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .kort .bilde img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
  .lightbox{display:none;position:fixed;inset:0;z-index:100;background:rgba(26,26,26,.92);align-items:center;justify-content:center;flex-direction:column;padding:30px;cursor:zoom-out}
  .lightbox.apen{display:flex}
  .lightbox img{max-width:95%;max-height:86%;object-fit:contain;border-radius:6px;box-shadow:0 12px 44px rgba(0,0,0,.55)}
  .lb-lukk{position:absolute;top:16px;right:26px;color:#fff;font-size:42px;line-height:1;cursor:pointer;opacity:.85}
  .lb-lukk:hover{opacity:1}
  .lb-tittel{color:var(--beige);margin-top:16px;font-size:18px;letter-spacing:.5px;font-style:italic}
  .kort .mangler{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    background:linear-gradient(135deg,#efece6,#e2ddd3);color:#a89f8f;text-align:center;padding:14px}
  .kort .mangler .ikon{font-size:26px;opacity:.6}
  .kort .mangler small{font-size:11px;letter-spacing:.5px;text-transform:uppercase}
  .kort .nr{position:absolute;top:8px;left:8px;background:rgba(26,26,26,.78);color:var(--gull);font-size:12px;padding:3px 9px;border-radius:12px;letter-spacing:.5px}
  .kort .krop{padding:14px 15px 6px;flex:1}
  .kort h3{font-size:17px;line-height:1.2}
  .kort .lenker{display:flex;flex-wrap:wrap;gap:7px;padding:10px 15px 15px}
  .kort .lenker a{font-size:12.5px;text-decoration:none;padding:6px 11px;border-radius:16px;border:1px solid var(--beige-mork);background:var(--beige);transition:.15s;white-space:nowrap}
  .kort .lenker a:hover{border-color:var(--gull);background:#fff}
  .kort .lenker a.mangl{opacity:.4;cursor:default;pointer-events:none}

  .innkjop-knapp{background:#fff;color:var(--gull-mork);border:1.5px solid var(--gull);text-decoration:none;font-weight:bold}
  .innkjop-knapp:hover{background:var(--gull);color:#fff}
  .filterpanel{display:none}
  .filterpanel.apen{display:block}
  #filterknapp-toggle.apen{background:var(--ink);color:#fff;border-color:var(--ink)}
  #filterknapp-toggle.harfilter{border-color:var(--gull);color:var(--gull-mork)}
  #filterknapp-toggle.harfilter.apen{color:#fff}
  #filter-ant{font-weight:bold}
  .taggfilter{border-top:1px solid var(--beige-mork);margin-top:14px;padding-top:12px}
  .taggfilter .tf-tittel{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:#8a857b;margin-bottom:8px}
  .taggfilter .tf-rad{display:flex;flex-wrap:wrap;gap:7px}
  .tf-tagg{font-family:inherit;font-size:12.5px;padding:6px 12px;border:1px solid var(--beige-mork);background:#fff;border-radius:16px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px}
  .tf-tagg:hover{border-color:var(--gull)}
  .tf-tagg.aktiv{background:var(--gull);color:#fff;border-color:var(--gull)}
  .tf-tagg .ant{font-size:11px;opacity:.6}
  .tf-tagg.aktiv .ant{opacity:.85}
  .kt-rad .tf-tagg.aktiv{background:var(--ink);border-color:var(--ink)}
  .kt-rad .tf-tagg:hover{border-color:var(--ink)}
  .niv-rad .tf-tagg.aktiv{background:var(--gull-mork);border-color:var(--gull-mork)}
  .niv-rad .tf-tagg:hover{border-color:var(--gull-mork)}
  .tf-nullstill{font-family:inherit;font-size:12.5px;padding:6px 12px;border:1px solid transparent;background:none;color:var(--gull-mork);cursor:pointer;text-decoration:underline}
  .kort .tagger{display:flex;flex-wrap:wrap;gap:5px;padding:2px 15px 0}
  .kort .tagger .t{font-size:10.5px;letter-spacing:.3px;padding:2px 8px;border-radius:10px;background:var(--beige-mork);color:#6b6559;cursor:pointer;transition:.15s}
  .kort .tagger .t:hover{background:var(--gull);color:#fff}
  .ingen{text-align:center;padding:60px 0;opacity:.6}
  footer{text-align:center;padding:30px 0;font-size:13px;opacity:.55}
  .redig{max-width:1100px;margin:0 auto;padding:0 20px 30px}
  .redig .boks{background:#fff;border:1px dashed var(--gull);border-radius:10px;padding:16px 18px;font-size:13.5px;opacity:.9}
  .redig b{color:var(--gull-mork)}
</style>
</head>
<body>

<div class="cba-topp">
  <img src="cba-logo.jpg" alt="Creative Business Academy">
  <div class="navn"><b id="t-merke"></b><small id="t-merke-under"></small></div>
</div>

<header class="topp">
  <div class="wrap">
    <div class="kick" id="t-kick"></div>
    <h1 id="t-tittel"></h1>
    <p id="t-ingress"></p>
  </div>
</header>

<div class="verktoylinje">
  <div class="wrap">
    <div class="rad">
      <input id="sok" type="search" placeholder="Søk etter maleri eller nummer …" oninput="tegn()">
      <button class="filterknapp aktiv" data-f="alle" onclick="settFilter(this)">Alle</button>
      <button class="filterknapp" data-f="nr" onclick="settFilter(this)">Kun nummererte</button>
      <button class="filterknapp" data-f="video" onclick="settFilter(this)">Har video</button>
      <button class="filterknapp" id="filterknapp-toggle" onclick="toggleFilterpanel()">☰ Filtre <span id="filter-ant"></span></button>
      <a class="filterknapp innkjop-knapp" id="innkjop-knapp" href="https://gentle-lily-acd730.netlify.app" target="_blank" rel="noopener">🛒 Innkjøpshjelpen</a>
      <span class="teller" id="teller"></span>
    </div>
    <div class="filterpanel" id="filterpanel">
    <div class="taggfilter" id="kurstypefilter">
      <div class="tf-tittel">Type kurs</div>
      <div class="tf-rad kt-rad" id="kt-rad"></div>
    </div>
    <div class="taggfilter" id="nivafilter">
      <div class="tf-tittel">Nivå</div>
      <div class="tf-rad niv-rad" id="niv-rad"></div>
    </div>
    <div class="taggfilter" id="taggfilter">
      <div class="tf-tittel">Teknikk / materiale</div>
      <div class="tf-rad" id="tf-rad"></div>
    </div>
    </div>
  </div>
</div>

<main class="wrap">
  <div class="rutenett" id="rutenett"></div>
  <div class="ingen" id="ingen" style="display:none">Ingen malerier passer søket.</div>
</main>

<div class="redig">
  <div class="boks">💡 <b>Rediger i side-editoren:</b> hvert maleri er et kort du kan endre. Lim inn <b>bilde</b>-lenke (fra Simplero), <b>video</b>-lenke og <b>kurs</b>-lenke etter hvert — produktliste-lenkene er allerede koblet på.</div>
</div>

<footer class="wrap" id="t-footer"></footer>

<div class="lightbox" id="lightbox" onclick="lukkBilde()">
  <span class="lb-lukk" aria-label="Lukk">×</span>
  <img id="lb-img" src="" alt="">
  <div class="lb-tittel" id="lb-tittel"></div>
</div>

// ── render ──────────────────────────────────────────────
var aktivtFilter = 'alle';
var aktiveTags = [];
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function sett(id,v){var e=document.getElementById(id); if(e) e.textContent=v;}
function settFilter(btn){
  aktivtFilter=btn.getAttribute('data-f');
  document.querySelectorAll('.filterknapp').forEach(function(b){b.classList.remove('aktiv');});
  btn.classList.add('aktiv');
  tegn();
}

function passer(m,q){
  if(aktivtFilter==='nr' && !m.nr) return false;
  if(aktivtFilter==='video' && !m.video) return false;
  if(aktiveTags.length){
    var mt=m.tags||[];
    for(var i=0;i<aktiveTags.length;i++){ if(mt.indexOf(aktiveTags[i])===-1) return false; }
  }
  if(!q) return true;
  var hay=((m.tittel||'')+' '+(m.nr||'')+' '+((m.tags||[]).join(' '))).toLowerCase();
  return hay.indexOf(q)>-1;
}

function visBilde(src,tittel){
  document.getElementById('lb-img').src=src;
  document.getElementById('lb-tittel').textContent=tittel||'';
  document.getElementById('lightbox').classList.add('apen');
}
function lukkBilde(){ document.getElementById('lightbox').classList.remove('apen'); }
document.addEventListener('keydown',function(e){ if(e.key==='Escape') lukkBilde(); });

function toggleFilterpanel(){
  var p=document.getElementById('filterpanel');
  var b=document.getElementById('filterknapp-toggle');
  var apen=p.classList.toggle('apen');
  b.classList.toggle('apen', apen);
}
function oppdaterFilterAnt(){
  var e=document.getElementById('filter-ant');
  if(e) e.textContent = aktiveTags.length ? '('+aktiveTags.length+')' : '';
  var b=document.getElementById('filterknapp-toggle');
  if(b) b.classList.toggle('harfilter', aktiveTags.length>0);
}
function toggleTag(t){
  var i=aktiveTags.indexOf(t);
  if(i>-1) aktiveTags.splice(i,1); else aktiveTags.push(t);
  byggTaggfilter(); tegn();
}
function nullstillTagger(){ aktiveTags=[]; byggTaggfilter(); tegn(); }

var KURSTYPER = ['A-Å','Teknikk trening','MINIKURS','Hovedkurs','ENG Kurs','Basis-info/Fakta','livesendinger','Marked','Inspirasjon'];
var NIVAER = ['Nybegynner','LEVEL2','LEVEL3','Advanced'];

function taggChip(t,teller){
  var akt=aktiveTags.indexOf(t)>-1?' aktiv':'';
  return '<button class="tf-tagg'+akt+'" onclick="toggleTag('+JSON.stringify(t).replace(/"/g,'&quot;')+')">'+esc(t)+' <span class="ant">'+teller[t]+'</span></button>';
}

function byggTaggfilter(){
  var teller={};
  TEKST.malerier.forEach(function(m){ (m.tags||[]).forEach(function(t){ teller[t]=(teller[t]||0)+1; }); });
  var etterAntall=function(a,b){ return teller[b]-teller[a] || a.localeCompare(b,'no'); };
  var alle=Object.keys(teller);

  var kt=alle.filter(function(t){return KURSTYPER.indexOf(t)>-1;}).sort(etterAntall).map(function(t){return taggChip(t,teller);}).join('');
  var niv=NIVAER.filter(function(t){return teller[t];}).map(function(t){return taggChip(t,teller);}).join('');
  var tk=alle.filter(function(t){return KURSTYPER.indexOf(t)===-1 && NIVAER.indexOf(t)===-1;}).sort(etterAntall).map(function(t){return taggChip(t,teller);}).join('');
  if(aktiveTags.length){
    tk+='<button class="tf-nullstill" onclick="nullstillTagger()">Nullstill ('+aktiveTags.length+')</button>';
  }
  document.getElementById('kt-rad').innerHTML=kt;
  document.getElementById('niv-rad').innerHTML=niv;
  document.getElementById('tf-rad').innerHTML=tk;
  oppdaterFilterAnt();
}

function lenke(url,ikon,tekst){
  if(url) return '<a href="'+esc(url)+'" target="_blank" rel="noopener">'+ikon+' '+tekst+'</a>';
  return '<a class="mangl">'+ikon+' '+tekst+'</a>';
}

function kortHtml(m){
  var ph = '<div class="mangler"><span class="ikon">🖼️</span><small>Bilde mangler</small></div>';
  var bilde = ph + (m.bilde ? '<img src="'+esc(m.bilde)+'" alt="'+esc(m.tittel)+'" loading="lazy" onerror="this.remove()" onclick="visBilde(this.src,this.alt)">' : '');
  var nr = m.nr ? '<span class="nr">nr '+esc(m.nr)+'</span>' : '';
  var tagger = (m.tags && m.tags.length)
    ? '<div class="tagger">'+m.tags.map(function(t){return '<span class="t" onclick="toggleTag('+JSON.stringify(t).replace(/"/g,'&quot;')+')">'+esc(t)+'</span>';}).join('')+'</div>'
    : '';
  return '<article class="kort">'
    + '<div class="bilde">'+bilde+nr+'</div>'
    + '<div class="krop"><h3>'+esc(m.tittel)+'</h3></div>'
    + tagger
    + '<div class="lenker">'
    +   lenke(m.produktliste,'📄','Produktliste')
    +   lenke(m.video,'🎬','Video')
    +   lenke(m.kurs,'🎓','Kurs')
    + '</div></article>';
}

function tegn(){
  var q=(document.getElementById('sok').value||'').trim().toLowerCase();
  var liste=TEKST.malerier.filter(function(m){return passer(m,q);});
  document.getElementById('rutenett').innerHTML=liste.map(kortHtml).join('');
  document.getElementById('ingen').style.display = liste.length ? 'none':'block';
  var medListe=TEKST.malerier.filter(function(m){return m.produktliste;}).length;
  var tagtekst = aktiveTags.length ? ' · filtrert på '+aktiveTags.join(' + ') : '';
  document.getElementById('teller').textContent =
    liste.length+' av '+TEKST.malerier.length+' malerier · '+medListe+' med produktliste'+tagtekst;
}

// init
sett('t-merke',TEKST.merke); sett('t-merke-under',TEKST.merkeUnder);
sett('t-kick',TEKST.kick); sett('t-tittel',TEKST.tittel); sett('t-ingress',TEKST.ingress);
sett('t-footer',TEKST.footer);
byggTaggfilter();
tegn();
</script>
